<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d3e6fd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e3a6e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SplitDumb">
<title>SplitDumb</title>
<style>
  :root {
    --bg:#f1f5fb; --surface:#ffffff; --ink:#14203a; --muted:#5f6b85; --line:#e1e8f4;
    --primary:#8fbcf8; --primary-ink:#10294f; --primary-soft:#e8f1fe; --accent:#2f66c8; --hd-ink:#10294f; --hd-chip:rgba(16,41,79,.10);
    --good:#0f9f6e; --good-soft:#def7ec; --bad:#e5484d; --bad-soft:#ffe8ea; --warn:#a96a00; --warn-soft:#fff1d1;
    --g1:#d3e6fd; --g2:#a9cdf8; --b1:#8fbcf8; --b2:#5b93ea; --shadow:0 1px 2px rgba(20,45,100,.05), 0 8px 22px rgba(20,45,100,.06);
    /* chart colours: c0-c5 for people and categories, c7 grey for "no category" */
    --c0:#5b93ea; --c1:#e08a1e; --c2:#0f9f6e; --c3:#e5484d; --c4:#8b5cf6; --c5:#b94fa8; --c7:#8a94b0;
    --danger:#c62828; --danger-ink:#ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0b1220; --surface:#121a2e; --ink:#e8eefc; --muted:#93a0bf; --line:#23304f;
      --primary:#9cc4fb; --primary-ink:#0b1b3a; --primary-soft:#1b2d57; --accent:#9cc4fb; --hd-ink:#ffffff; --hd-chip:rgba(255,255,255,.18);
      --good:#3dd6a1; --good-soft:#12362c; --bad:#ff7d82; --bad-soft:#3c1d26; --warn:#f6c453; --warn-soft:#3b3115;
      --g1:#1e3a6e; --g2:#245b8a; --b1:#6aa4ff; --b2:#9cc4fb; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
      --c0:#6aa4ff; --c1:#f2a64a; --c2:#3dd6a1; --c3:#ff7d82; --c4:#a78bfa; --c5:#d98ccb; --c7:#6b7799;
      --danger:#ff7d82; --danger-ink:#3a0f12;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  a { color:var(--accent); }

  /* ---- shell: top bar, side menu, content */
  #bar { position:sticky; top:0; z-index:20; height:56px; display:flex; align-items:center; gap:10px; padding:0 14px;
         background:linear-gradient(135deg,var(--g1),var(--g2)); color:var(--hd-ink); box-shadow:0 2px 10px rgba(20,50,140,.18); }
  #bar .logo { color:var(--hd-ink); text-decoration:none; font-weight:800; font-size:20px; letter-spacing:-.02em; margin-right:auto; }
  #bar .logo span { opacity:.8; font-weight:600; }
  #burger { width:auto; margin:0; padding:6px 11px; font-size:19px; line-height:1; background:var(--hd-chip); color:var(--hd-ink); border:0; border-radius:10px; cursor:pointer; }
  #bar .me { text-decoration:none; }
  #side { position:fixed; top:56px; bottom:0; left:0; width:290px; max-width:86vw; z-index:15; padding:14px 12px 20px;
          background:var(--surface); border-right:1px solid var(--line); overflow-y:auto; transform:translateX(-102%); transition:transform .2s ease;
          display:flex; flex-direction:column; gap:2px; }
  #scrim { display:none; position:fixed; inset:56px 0 0 0; background:rgba(6,12,32,.5); z-index:12; }
  body.menu-open #side { transform:none; box-shadow:0 0 40px rgba(0,0,0,.25); }
  body.menu-open #scrim { display:block; }
  #main { max-width:700px; margin:0 auto; padding:18px 16px 60px; }
  body:not(.authed) #side, body:not(.authed) #burger, body:not(.authed) #scrim, body:not(.authed) #bar .me { display:none !important; }
  @media (min-width:900px) {
    #side { transform:none; box-shadow:none; }
    #burger { display:none; } #scrim { display:none !important; }
    body.authed #main { margin-left:290px; max-width:none; padding:24px 32px 60px; }
    body.authed #main > #app { max-width:700px; }
  }

  /* ---- side menu */
  .who { display:flex; align-items:center; gap:10px; padding:6px 8px 14px; border-bottom:1px solid var(--line); margin-bottom:8px; }
  .who b { display:block; line-height:1.2; } .who small { color:var(--muted); }
  .navhead { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:14px 10px 6px; }
  .nav { display:flex; align-items:center; gap:8px; justify-content:space-between; padding:10px 10px; border-radius:12px; color:var(--ink); text-decoration:none; font-weight:500; }
  .nav:hover { background:var(--bg); }
  .nav.active { background:var(--primary-soft); color:var(--accent); font-weight:700; }
  .nav .tname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav.add { color:var(--accent); font-weight:700; }
  .sidefoot { margin-top:auto; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  /* Account and Log out are the same height; Log out is red (filled, with text that stays readable in both themes) */
  .sidefoot .nav { height:44px; }
  button.logout { width:100%; height:44px; margin:0; padding:0 14px; background:var(--danger); color:var(--danger-ink); }

  /* ---- type & surfaces */
  h2 { font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:28px 0 10px; }
  h2.page { font-size:26px; text-transform:none; letter-spacing:-.02em; color:var(--ink); margin:6px 0; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:13px 15px; margin-bottom:10px; box-shadow:var(--shadow); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .person { display:flex; align-items:center; gap:10px; min-width:0; }
  .muted { color:var(--muted); font-size:14px; }
  .viewbar { display:flex; gap:8px; margin:8px 0 10px; }
  .viewbar select { margin:0; height:40px; padding:0 10px; font-size:15px; width:auto; flex:1; min-width:0; }
  .cur { color:var(--accent); font-size:12.5px; font-weight:800; letter-spacing:.08em; margin:16px 0 6px; }
  .amt { font-weight:700; padding:3px 10px; border-radius:999px; font-size:14px; white-space:nowrap; }
  .amt.pos { color:var(--good); background:var(--good-soft); } .amt.neg { color:var(--bad); background:var(--bad-soft); } .amt.zero { color:var(--muted); background:var(--bg); font-weight:500; }
  .err { color:var(--bad); margin:8px 0; font-size:14px; } .ok { color:var(--good); margin:8px 0; font-size:14px; }
  .back { display:inline-flex; align-items:center; gap:6px; text-decoration:none; font-weight:600; font-size:15px; padding:6px 12px 6px 8px; margin:0 0 4px -8px; border-radius:999px; }
  .back:hover { background:var(--primary-soft); }
  .hero { padding:18px; border-radius:20px; color:var(--hd-ink); background:linear-gradient(135deg,var(--g1),var(--g2)); box-shadow:var(--shadow); margin-bottom:12px; }
  .hero h1 { margin:0 0 4px; font-size:24px; letter-spacing:-.02em; } .hero p { margin:0; opacity:.9; }

  /* ---- people, tags */
  .av { width:34px; height:34px; border-radius:50%; flex:none; display:inline-grid; place-items:center; color:#fff; font-weight:700; font-size:14px; background:hsl(var(--h) 52% 46%); }
  .av::before { content:attr(data-i); }
  .av.pic { background-size:cover; background-position:center; background-repeat:no-repeat; }
  .av.pic::before { content:none; }
  .av.big { width:72px; height:72px; font-size:28px; }
  .av.sm { width:28px; height:28px; font-size:12px; }
  .tag { font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; flex:none; }
  .tag.settled { color:var(--good); background:var(--good-soft); } .tag.settled::before { content:"✓ "; }
  .tag.open { color:var(--warn); background:var(--warn-soft); }
  .tag.new { color:var(--muted); background:var(--bg); border:1px solid var(--line); }

  /* ---- forms */
  input, select, button { font:inherit; padding:11px 13px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); width:100%; margin:4px 0; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  button { background:var(--primary); color:var(--primary-ink); border:0; cursor:pointer; font-weight:700; }
  button:hover { filter:brightness(1.06); }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); width:auto; padding:5px 12px; font-weight:500; margin:0; font-size:14px; }
  button.ghost:hover { color:var(--accent); border-color:var(--accent); filter:none; }
  button.danger:hover { color:var(--bad); border-color:var(--bad); }
  /* Save / Cancel row of the expense form: same height and type size, Save a bit wider */
  /* currency: the visible box shows only the 3-letter code; a transparent native select sits on top so the picker still lists full names */
  .selbox { position:relative; display:flex; margin:4px 0; }
  .selbox .selshow { flex:1; display:flex; align-items:center; justify-content:space-between; gap:8px; min-width:0; padding:11px 13px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); }
  .selbox .selshow::after { content:""; flex:none; width:7px; height:7px; margin:-3px 2px 0 0; border-right:2px solid var(--ink); border-bottom:2px solid var(--ink); transform:rotate(45deg); }
  .selbox select { position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; opacity:0; cursor:pointer; }
  .selbox:focus-within .selshow { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .formbtns { display:flex; gap:8px; margin-top:8px; }
  .formbtns button, .formbtns button.ghost { flex:1; width:auto; height:44px; padding:0 14px; margin:0; font-size:16px; font-weight:700; }
  .formbtns button:first-child { flex:2; }
  button.icon { width:36px; height:36px; padding:0; display:inline-grid; place-items:center; border-radius:10px; flex:none; }
  svg.ico { width:18px; height:18px; display:block; }
  /* header: title row, status tag (wraps below on a narrow phone) and the "N people" line are all 8px apart */
  .trip-head { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:8px 0 0; }
  .trip-head h2.page { margin:0 4px 0 0; min-width:0; overflow-wrap:anywhere; }
  .trip-meta { margin-top:4px; }   /* text has ~4px of built-in leading, so this reads as the same 8px gap */
  button:disabled { opacity:.5; cursor:default; }
  label.chk { display:flex; align-items:center; gap:9px; padding:5px 0; } label.chk input { width:auto; margin:0; accent-color:var(--accent); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid2b { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; } .grid2b button { width:auto; padding-left:18px; padding-right:18px; }
  .upper { text-transform:uppercase; }
  .seg { display:flex; gap:6px; margin:6px 0; background:var(--bg); padding:4px; border-radius:14px; }
  .segbtn { background:transparent; color:var(--muted); border:0; flex:1; width:auto; font-weight:600; margin:0; }
  .segbtn.on { background:var(--surface); color:var(--accent); box-shadow:var(--shadow); }
  .srow { display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; gap:8px; padding:2px 0; }
  .srow .pctwrap { display:none; align-items:center; gap:4px; }
  .srow .pct { width:72px; margin:0; text-align:right; }
  .srow .chk, .srow .chk .person { min-width:0; }
  .prev { min-width:60px; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:13.5px; }
  .splitbox.mode-percent .pctwrap { display:flex; } .splitbox.mode-percent .inc { display:none; }
  .splitbox:not(.mode-percent) [data-f="pcttotal"] { display:none; }
  .card.exp-edit { border-color:var(--accent); }
  .card.exp-edit > h2 { margin:0 0 8px; }
  details.sec { margin:14px 0; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:0 14px; }
  details.sec > summary { cursor:pointer; list-style:none; padding:14px 0; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  details.sec > summary::-webkit-details-marker { display:none; }
  details.sec > summary::after { content:"▾"; color:var(--muted); transition:transform .15s; }
  details.sec[open] > summary::after { transform:rotate(180deg); }
  details.sec[open] > summary { border-bottom:1px solid var(--line); margin-bottom:8px; }
  details.sec .card { box-shadow:none; }
  /* columns appear only while each field gets at least ~165px; on a narrow phone they stack instead of spilling over */
  .filters { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 165px), 1fr)); gap:6px 10px; padding:4px 0 10px; }
  .filters label { font-size:12.5px; color:var(--muted); font-weight:600; min-width:0; }
  /* one explicit height for every filter field, so the date boxes match the dropdowns */
  .filters input, .filters select { margin:2px 0 0; padding:0 10px; height:40px; line-height:normal; font-weight:400; min-width:0; max-width:100%; }
  input[type=datetime-local] { -webkit-appearance:none; appearance:none; text-align:left; height:47px; padding-top:0; padding-bottom:0; }
  input[type=datetime-local]::-webkit-date-and-time-value { text-align:left; margin:0; }
  input[type=datetime-local]::-webkit-datetime-edit { padding:0; text-align:left; }
  .filters input[type=date] { -webkit-appearance:none; appearance:none; text-align:left; }
  /* Safari / iPhone centres a chosen date inside the box; pin it to the left like the other fields */
  .filters input[type=date]::-webkit-date-and-time-value { text-align:left; margin:0; }
  .filters input[type=date]::-webkit-datetime-edit { padding:0; text-align:left; }
  .filters button { grid-column:1/-1; justify-self:start; }
  #toasts { position:fixed; z-index:50; top:64px; left:50%; transform:translateX(-50%); width:min(440px,calc(100vw - 24px)); display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .toast { pointer-events:auto; display:flex; align-items:flex-start; gap:10px; padding:12px 12px 12px 14px; border-radius:14px; background:var(--surface); border:1px solid var(--line);
           box-shadow:0 10px 30px rgba(15,30,70,.28); font-size:15px; animation:tin .18s ease-out; }
  .toast.err { border-left:5px solid var(--bad); } .toast.err .ti { color:var(--bad); }
  .toast.ok { border-left:5px solid var(--good); } .toast.ok .ti { color:var(--good); }
  .toast .tm { flex:1; word-break:break-word; }
  .toast .tx { width:auto; margin:0; padding:0 6px; background:transparent; color:var(--muted); font-size:20px; line-height:1; }
  @keyframes tin { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }
  .btns { display:flex; gap:6px; align-items:center; }
  .exp { align-items:flex-start; }
  .exp .title { font-weight:600; }
  /* ---- statistics bars */
  .stathead { font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:10px; }
  .statrows > * + * { margin-top:12px; }
  .card.statcard { padding:12px; }
  .statrows > .statgrp { border:1px solid var(--line); border-radius:14px; background:var(--bg); }
  .statrows > .statgrp.open { border-color:var(--accent); }
  .statrows > .statgrp + .statgrp { margin-top:10px; }
  .statrowbtn { display:flex; align-items:center; gap:8px; width:100%; padding:10px; margin:0; background:transparent; color:inherit; font-weight:inherit; text-align:left; border:0; border-radius:14px; cursor:pointer; }
  .statrowbtn:hover, .statrowbtn:active { background:var(--primary-soft); filter:none; }
  .statrowbtn:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .statrowbtn > .stat { flex:1; min-width:0; }
  .statrowbtn .bar, .statsub .bar { background:var(--line); }
  .chev { flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--surface); color:var(--accent); box-shadow:0 0 0 1px var(--line); }
  .chev svg { width:16px; height:16px; transition:transform .15s; }
  .statrowbtn[aria-expanded=true] .chev svg { transform:rotate(180deg); }
  .statsub { padding:10px 8px; border-top:1px solid var(--line); }
  .statsub .stat + .stat { margin-top:10px; }
  .statsub .sname, .statsub .sval { font-size:13.5px; }
  .statsub .row, .statsub .person { gap:5px; }
  .statsub .catbadge.sm { width:24px; height:24px; border-radius:8px; }
  .statsub .catbadge.sm svg { width:15px; height:15px; }
  .stat .row, .stat .person { gap:8px; }
  .stat .sname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; }
  .stat .sval { white-space:nowrap; font-variant-numeric:tabular-nums; }
  .bar { height:8px; border-radius:999px; background:var(--bg); margin-top:6px; overflow:hidden; }
  .bar > i { display:block; height:100%; min-width:2px; border-radius:999px; background:linear-gradient(90deg,var(--b1),var(--b2)); }
  .statchart { display:flex; flex-wrap:wrap; gap:14px 22px; align-items:center; justify-content:center; }
  .statrows { flex:1 1 230px; min-width:0; }
  .donut { width:150px; height:150px; flex:none; }
  .donut .dtop { font:700 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:var(--ink); }
  .donut .dbot { font:600 9px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:var(--muted); letter-spacing:.08em; }
  .catbadge.sm { width:28px; height:28px; border-radius:8px; }
  .catbadge.sm svg.ico { width:16px; height:16px; }
  .expmain { display:flex; gap:10px; min-width:0; flex:1; }
  .expmain > div { min-width:0; overflow-wrap:anywhere; }

  /* ---- categories */
  .catbadge { width:34px; height:34px; border-radius:10px; flex:none; display:grid; place-items:center; background:var(--primary-soft); color:var(--accent); }
  .catbadge.none { background:var(--bg); color:var(--muted); }
  .cats { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 2px; }
  .catchip { position:relative; display:inline-block; }
  .catchip input { position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; opacity:0; cursor:pointer; }
  .catchip span { display:inline-flex; align-items:center; gap:6px; padding:7px 12px 7px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:14px; font-weight:600; }
  .catchip svg.ico { width:16px; height:16px; }
  .catchip input:checked + span { background:var(--primary-soft); color:var(--accent); border-color:var(--accent); }
  .catchip input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<header id="bar">
  <button id="burger" aria-label="Open menu">☰</button>
  <a class="logo" href="#/">Split<span>Dumb</span></a>
  <span id="barright"></span>
</header>
<div id="toasts" aria-live="polite"></div>
<div id="scrim"></div>
<aside id="side"></aside>
<main id="main"><div id="app">Loading…</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="logic.js"></script>
<script>
const app = document.getElementById("app");
const $ = (id) => document.getElementById(id);
const configured = window.SUPABASE_URL && !window.SUPABASE_URL.includes("YOUR-PROJECT");
const sb = configured ? supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;

const CURRENCIES = [["SGD","Singapore dollar"],["MYR","Malaysian ringgit"],["USD","US dollar"],["EUR","Euro"],["GBP","British pound"],["JPY","Japanese yen"],
  ["THB","Thai baht"],["IDR","Indonesian rupiah"],["AUD","Australian dollar"],["CNY","Chinese yuan"],["HKD","Hong Kong dollar"],["KRW","South Korean won"],
  ["VND","Vietnamese dong"],["PHP","Philippine peso"],["INR","Indian rupee"],["TWD","Taiwan dollar"],["NZD","New Zealand dollar"],["CAD","Canadian dollar"],["CHF","Swiss franc"],["AED","UAE dirham"]];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = (cents) => (cents / 100).toFixed(2);
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const PIC_OK = /^data:image\/jpeg;base64,[A-Za-z0-9+/]+=*$/;
const av = (name, cls = "", pic = "") => {
  const ok = pic && PIC_OK.test(pic);
  return `<span class="av ${cls}${ok ? " pic" : ""}" style="--h:${hue(name)}${ok ? `;background-image:url('${pic}')` : ""}" data-i="${esc((String(name).trim()[0] || "?").toUpperCase())}"></span>`;
};
// Icons: 24x24 outline paths (Lucide, ISC licence), drawn inline so there is nothing extra to load.
const ICONS = {
  chevron: `<path d="m6 9 6 6 6-6"/>`,
  edit: `<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>`,

// Donut: one arc per part (cents + colour), total in the middle. Drawn as stroked circles, no library.
const donut = (parts, total, cur, aria) => {
  const R = 44, C = 2 * Math.PI * R, gap = parts.length > 1 ? 1.5 : 0;
  let acc = 0;
  const arcs = parts.map((p) => {
    const len = (p.cents / total) * C;
    const s = `<circle cx="60" cy="60" r="${R}" fill="none" stroke-width="16" style="stroke:${p.color}" stroke-dasharray="${Math.max(len - gap, 0.4).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 60 60)"/>`;
    acc += len;
    return s;
  }).join("");
  return `<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="${esc(aria)}"><circle cx="60" cy="60" r="${R}" fill="none" stroke-width="16" style="stroke:var(--bg)"/>${arcs}
    <text x="60" y="59" text-anchor="middle" class="dtop">${esc(money(total))}</text><text x="60" y="73" text-anchor="middle" class="dbot">${esc(cur)}</text></svg>`;

function loadFx(onUpdate) {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem("fx")); } catch {}
  if (cached && cached.rates && cached.rates.USD) FX = { rates: { ...FX_FALLBACK, ...cached.rates }, live: true, date: cached.date || "" };
  if (cached && Date.now() - cached.t < 12 * 3600e3) return;
  fetch("https://open.er-api.com/v6/latest/USD").then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((d) => {
      if (d.result !== "success" || !d.rates || !(d.rates.SGD > 0) || !(d.rates.MYR > 0)) throw 0;
      const date = String(d.time_last_update_utc || "").slice(5, 16);
      FX = { rates: { ...FX_FALLBACK, ...d.rates }, live: true, date };
      try { localStorage.setItem("fx", JSON.stringify({ t: Date.now(), date, rates: d.rates })); } catch {}
      onUpdate();
    }).catch(() => {});
}

async function call(fn, args = {}) {

function toast(msg, kind = "err") {
  const t = document.createElement("div");
  t.className = "toast " + kind; t.setAttribute("role", kind === "err" ? "alert" : "status");
  t.innerHTML = `<span class="ti">${kind === "err" ? "⚠" : "✓"}</span><span class="tm"></span><button type="button" class="tx" aria-label="Dismiss">×</button>`;

}

// ------------------------------------------------------------------ routing
async function route() {
  document.body.classList.remove("menu-open");
  if (!configured) { renderShell(); app.innerHTML = `<div class="card">Set your Supabase URL and key in <code>config.js</code> first.</div>`; return; }
  if (!session) { renderShell(); return renderAuth(); }
  try {
    trips = await call("my_groups");       // also proves the session is still valid
    renderShell();
    const h = location.hash, g = h.match(/^#\/g\/([0-9a-f-]{36})$/i);
    if (g) await renderGroup(g[1]);
    else if (h === "#/new") renderNew();
    else if (h === "#/account") renderAccount();
    else renderHome();
  } catch (e) {
    renderShell();
    if (e.expired) return renderAuth("Your session expired. Please log in again.");
    app.innerHTML = `<div class="err">${esc(friendly(e.message))}</div><a class="back" href="#/">← All trips</a>`;
  }
}

// Centre-crop an image file to a size x size JPEG data URL (small enough to store in the database).
async function squarePhoto(file, size) {
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { throw new Error("Couldn't read that image. Try a JPG or PNG."); }
  const side = Math.min(bmp.width, bmp.height), c = document.createElement("canvas");
  c.width = c.height = size;
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, size, size);
  x.drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, size, size);
  return c.toDataURL("image/jpeg", 0.82);
}

const openSecs = new Set();   // which collapsed sections the user has opened (survives redraws)
const filt = { gid: null, from: "", to: "", by: "", paid: "", cur: "", cat: "" };   // expense list filters

async function renderGroup(id) {
  editingId = null;
  let d;
  try { d = await call("get_group", { p_group: id }); }
  catch (e) {
    if (/not a member/i.test(e.message)) {
      app.innerHTML = `<a class="back" href="#/">← All trips</a>

      return;
    }

  }

function drawGroup(ctx) {
  if (filt.gid !== ctx.id) Object.assign(filt, { gid: ctx.id, from: "", to: "", by: "", paid: "", cur: "", cat: "" });
  const { id, group, meId, members, expenses, payments, splits } = ctx;
  const me = members.find((m) => m.id === meId);
  const name = Object.fromEntries(members.map((m) => [m.id, m.name]));
  const youTag = (m) => (m.id === meId ? " (you)" : "");

  // balances & spending are kept per currency; currencies are never converted or mixed
  const byCur = balancesByCurrency(members, expenses, splits, payments);
  const curs = Object.keys(byCur);
  const debts = curs.flatMap((c) => simplifyDebts(byCur[c]).map((d) => ({ ...d, currency: c })));
  const spend = spendingByCurrency(members, expenses, splits);
  const catSpend = spendingByCategory(expenses, catKey);
  const kind = !expenses.length ? "new" : debts.length ? "open" : "settled";

  // statistics: one chart at a time. By person / by category, for all currencies combined (converted, estimate) or one currency
  function paintStats() {
    const el = $("stats");
    if (!el) return;
    const multi = curs.length > 1;
    if (!multi) statsUI.view = curs[0];
    else if (statsUI.view !== "all" && !curs.includes(statsUI.view)) statsUI.view = "all";
    const view = statsUI.view, base = getStatsBase();
    let byPerson, byCat, label, missing = [];
    if (view === "all") {
      const cv = convertedSpending(members, expenses, splits, FX.rates, base, catKey);
      byPerson = members.map((m) => [m, cv.byMember[m.id]]); byCat = Object.entries(cv.byCat); label = "≈ " + base; missing = cv.missing;
    } else {
      byPerson = members.map((m) => [m, spend[view].byMember[m.id].spent]); byCat = Object.entries(catSpend[view].byCat); label = view;
    }
    const factor = view === "all" ? (c) => (FX.rates[c] > 0 && FX.rates[base] > 0 ? FX.rates[base] / FX.rates[c] : null) : (c) => (c === view ? 1 : null);
    const perCat = personCategorySpend(expenses, splits, factor, catKey);
    const people = byPerson.filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1])
      .map(([m, v], i) => {
        const sub = Object.entries(perCat[m.id] || {}).filter(([, x]) => x > 0).sort((a, b) => b[1] - a[1]);
        const subTotal = sub.reduce((t, [, x]) => t + x, 0);
        return { id: m.id, open: statsUI.open.has(m.id), icon: av(m.name, "sm", m.avatar), label: m.name + youTag(m), cents: v, color: `var(--c${i % 6})`,
          detail: sub.map(([k, x]) => statRow(`<span class="catbadge sm ${k ? "" : "none"}">${catIcon(k)}</span>`, catLabel(k), x, subTotal, `var(--c${CATCOLOR[k]})`)).join("") };
      });
    const cats = byCat.filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1])
      .map(([k, v]) => ({ icon: `<span class="catbadge sm ${k ? "" : "none"}">${catIcon(k)}</span>`, label: catLabel(k), cents: v, color: `var(--c${CATCOLOR[k]})` }));
    const parts = statsUI.tab === "person" ? people : cats, total = parts.reduce((t, p) => t + p.cents, 0);
    el.innerHTML = `<div class="seg">
        <button type="button" class="segbtn ${statsUI.tab === "person" ? "on" : ""}" data-tab="person">By person</button>
        <button type="button" class="segbtn ${statsUI.tab === "cat" ? "on" : ""}" data-tab="cat">By category</button></div>
      ${multi ? `<div class="viewbar"><select id="stview" aria-label="Currency">
          <option value="all" ${view === "all" ? "selected" : ""}>All currencies</option>
          ${curs.map((c) => `<option ${c === view ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
        ${view === "all" ? `<select id="statbase" aria-label="Convert to">${CURRENCIES.map(([c]) => c).filter((c) => FX.rates[c] > 0)
          .map((c) => `<option value="${c}" ${c === base ? "selected" : ""}>≈ ${c}</option>`).join("")}</select>` : ""}</div>` : ""}
      ${parts.length ? statCard(parts, total, label, statsUI.tab === "person" ? "Spending by person" : "Spending by category") : `<div class="muted">Nothing to show.</div>`}
      ${missing.length ? `<div class="muted">Not included (no exchange rate): ${esc(missing.join(", "))}</div>` : ""}`;
    el.querySelectorAll("[data-person]").forEach((b) => (b.onclick = () => {
      const id = b.dataset.person;
      statsUI.open.has(id) ? statsUI.open.delete(id) : statsUI.open.add(id);
      paintStats();
    }));
    el.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { statsUI.tab = b.dataset.tab; paintStats(); }));
    if ($("stview")) $("stview").onchange = (ev) => { statsUI.view = ev.target.value; paintStats(); };
    if ($("statbase")) $("statbase").onchange = (ev) => { try { localStorage.setItem("statsBase", ev.target.value); } catch {} paintStats(); };
  }

  app.innerHTML = `
    <a class="back" href="#/">← All trips</a>
    <div class="trip-head">
      <h2 class="page">${esc(group.name)}</h2>
      <button class="ghost icon" id="rename" title="Rename trip" aria-label="Rename trip">${svg("edit")}</button>
      <button class="ghost icon" id="copy" title="Copy link" aria-label="Copy link">${svg("link")}</button>
      ${tagHtml(kind)}</div>
    <div class="muted trip-meta">${members.length} people · you are ${esc(me.name)}</div>

    <h2>Add expense</h2>
    <div class="card" id="addform">${formHtml(ctx, null)}</div>

    <details class="sec" data-sec="bal" ${openSecs.has("bal") ? "open" : ""}><summary>Balances</summary>
    ${curs.length ? curs.map((c) => `<div class="cur">${esc(c)}</div>` + members.map((m) => { const b = byCur[c][m.id];
      return `<div class="card row"><div class="person">${av(m.name, "", m.avatar)}<span>${esc(m.name)}${youTag(m)}</span></div>
        <span class="amt ${b > 0 ? "pos" : b < 0 ? "neg" : "zero"}">${b > 0 ? "gets back " + esc(c) + " " + money(b) : b < 0 ? "owes " + esc(c) + " " + money(-b) : "settled"}</span></div>`; }).join("")).join("")
      : `<div class="muted">No expenses yet.</div>`}

    </details>

    <details class="sec" data-sec="settle" ${openSecs.has("settle") ? "open" : ""}><summary><span>Settle up${debts.length ? ` <span class="tag open">${debts.length} to pay</span>` : ""}</span></summary>
    ${debts.length ? debts.map((d, i) => `<div class="card row">
        <span>${esc(name[d.from])} pays ${esc(name[d.to])} <b>${esc(d.currency)} ${money(d.cents)}</b></span>
        <button class="ghost" data-settle="${i}">Mark paid</button></div>`).join("")
      : `<div class="muted">${expenses.length ? "Everyone is settled up." : "Nothing to settle yet."}</div>`}

    </details>

    <details class="sec" data-sec="stats" ${openSecs.has("stats") ? "open" : ""}><summary>Statistics</summary>
    ${curs.length ? `<div id="stats"></div>` : `<div class="muted">No expenses yet.</div>`}

    </details>

    <details class="sec" data-sec="exp" ${openSecs.has("exp") ? "open" : ""}><summary><span>Expenses <span class="tag new" id="expcount">${expenses.length}</span></span></summary>
      ${expenses.length ? `<div class="filters">
        <label>From<input type="date" id="f_from" value="${filt.from}"></label>
        <label>To<input type="date" id="f_to" value="${filt.to}"></label>
        <label>Added by<select id="f_by"><option value="">Anyone</option>${members.map((m) => `<option value="${m.id}" ${filt.by === m.id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select></label>
        <label>Paid by<select id="f_paid"><option value="">Anyone</option>${members.map((m) => `<option value="${m.id}" ${filt.paid === m.id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select></label>
        <label>Category<select id="f_cat"><option value="">All</option><option value="none" ${filt.cat === "none" ? "selected" : ""}>No category</option>${CATS.filter(([k]) => k).map(([k, label]) => `<option value="${k}" ${filt.cat === k ? "selected" : ""}>${label}</option>`).join("")}</select></label>
        <label>Currency<select id="f_cur"><option value="">All</option>${[...new Set(expenses.map(curOf))].sort().map((c) => `<option ${filt.cur === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
        <button type="button" class="ghost" id="f_clear">Clear filters</button>
      </div>` : ""}
      ${expenses.length ? `<div style="padding:0 0 10px"><button type="button" class="ghost" id="f_csv">⬇ Export CSV <span class="muted" id="csvn"></span></button></div>` : ""}
      <div id="explist"></div>
    </details>

    <h2>People</h2>
    ${members.map((m) => `<div class="card row"><div class="person">${av(m.name, "", m.avatar)}<div>${esc(m.name)}${youTag(m)}
        <div class="muted">${m.linked ? "@" + esc(m.username) : "no account"}</div></div></div>
        ${m.linked ? "" : `<button class="ghost" data-link="${m.id}">Link account</button>`}</div>`).join("")}
    <div class="card">
      <div class="muted">Add a friend who has an account</div>
      <div class="grid2b"><input id="newu" placeholder="their username" autocapitalize="none" autocorrect="off" spellcheck="false"><button id="addu">Add</button></div>
      <div class="muted" style="margin-top:8px">Or add someone by name only (no account)</div>
      <div class="grid2b"><input id="newm" placeholder="Name"><button id="addm">Add</button></div>
    </div>`;

  // ---- wiring
  paintStats();
  loadFx(paintStats);
  document.querySelectorAll('details.sec').forEach((el) => (el.ontoggle = () => (el.open ? openSecs.add(el.dataset.sec) : openSecs.delete(el.dataset.sec))));
  $("copy").onclick = async (ev) => {
    const btn = ev.currentTarget, url = location.href;
    try {
      await navigator.clipboard.writeText(url);
      btn.innerHTML = svg("check"); toast("Link copied", "ok");
      setTimeout(() => { btn.innerHTML = svg("link"); }, 1500);
    } catch { prompt("Copy this link:", url); }
  };
  $("rename").onclick = async () => {
    const n = prompt("Rename trip:", group.name);
    if (n === null || !n.trim() || n.trim() === group.name) return;
    try { await call("rename_group", { p_group: id, p_name: n.trim() }); route(); } catch (e) { showErr($("perr"), e); }
  };
  wireForm($("addform"), ctx, null);

  // ---- expenses list (filters redraw only the list, so typing/focus isn't lost)
  const when = (e) => e.spent_at || e.created_at;
  const localDay = (iso) => { const t = new Date(iso); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`; };
  let shown = expenses;
  function paintExp() {
    const list = expenses.filter((e) =>
      (!filt.from || localDay(when(e)) >= filt.from) && (!filt.to || localDay(when(e)) <= filt.to) &&
      (!filt.by || e.added_by === filt.by) && (!filt.paid || e.paid_by === filt.paid) && (!filt.cur || curOf(e) === filt.cur) &&
      (!filt.cat || (filt.cat === "none" ? !catKey(e.category) : catKey(e.category) === filt.cat)));
    shown = list;
    if ($("csvn")) $("csvn").textContent = list.length === expenses.length ? "" : `(${list.length} filtered)`;
    $("expcount").textContent = list.length === expenses.length ? expenses.length : `${list.length} of ${expenses.length}`;
    $("explist").innerHTML = list.length ? list.map((e) => {
      if (e.id === editingId) return `<div class="card exp-edit" data-editcard="${e.id}"><h2>Edit expense</h2>${formHtml(ctx, e)}</div>`;
      const sp = splits.filter((s) => s.expense_id === e.id);
      const mine = sp.find((s) => s.member_id === meId);
      const line2 = (mine ? `Your share: ${esc(curOf(e))} ${Number(mine.share).toFixed(2)}` : "You're not in this split")
        + (e.split_type === "percent" ? " · " + sp.map((s) => `${esc(name[s.member_id] || "?")} ${Number(s.percent)}%`).join(", ") : "");
      return `<div class="card row exp">
        <div class="expmain"><span class="catbadge ${catKey(e.category) ? "" : "none"}" title="${esc(catLabel(e.category))}">${catIcon(e.category)}</span>
        <div><div class="title">${esc(e.description)}</div>
          <div class="muted">${esc(name[e.paid_by] || "?")} paid ${esc(curOf(e))} ${Number(e.amount).toFixed(2)} · ${new Date(when(e)).toLocaleDateString()} ${new Date(when(e)).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}${e.added_by && name[e.added_by] ? ` · added by ${esc(name[e.added_by])}` : ""}</div>
          <div class="muted">${line2}</div></div></div>
        <div class="btns"><button class="ghost icon" data-edit="${e.id}" title="Edit" aria-label="Edit expense">${svg("edit")}</button><button class="ghost icon danger" data-del="${e.id}" title="Delete" aria-label="Delete expense">${svg("trash")}</button></div></div>`; }).join("")
      : `<div class="muted" style="padding:6px 0 12px">${expenses.length ? "No expenses match these filters." : "No expenses yet."}</div>`;
    const card = document.querySelector("[data-editcard]");
    if (card) wireForm(card, ctx, expenses.find((x) => x.id === editingId), () => { editingId = null; paintExp(); });
    document.querySelectorAll("[data-edit]").forEach((b) => (b.onclick = () => {
      editingId = b.dataset.edit; paintExp();     // only the list redraws, so a half-typed new expense up top is kept
      const c = document.querySelector("[data-editcard]"); if (c && c.scrollIntoView) c.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }));
    document.querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => {
      if (!confirm("Delete this expense?")) return;
      try { await call("delete_expense", { p_expense: b.dataset.del }); route(); } catch (e) { showErr($("perr"), e); }
    }));
  }
  if (expenses.length) {
    [["f_from", "from"], ["f_to", "to"], ["f_by", "by"], ["f_paid", "paid"], ["f_cat", "cat"], ["f_cur", "cur"]].forEach(([el, k]) =>
      ($(el).onchange = $(el).oninput = () => { filt[k] = $(el).value; paintExp(); }));
    $("f_clear").onclick = () => { Object.assign(filt, { from: "", to: "", by: "", paid: "", cur: "", cat: "" }); ["f_from", "f_to", "f_by", "f_paid", "f_cat", "f_cur"].forEach((x) => ($(x).value = "")); paintExp(); };
  }
  if (expenses.length) $("f_csv").onclick = () => {
    const cell = (v) => { let t = v == null ? "" : String(v); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;   // stop spreadsheet formula injection
      return /[",\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
    const head = ["Date", "Description", "Category", "Amount", "Currency", "Paid by", "Added by", "Split", ...members.map((m) => `Share: ${m.name}`)];
    const rows = [...shown].sort((a, b) => new Date(when(a)) - new Date(when(b))).map((e) => {
      const sp = splits.filter((s) => s.expense_id === e.id);
      return [localDay(when(e)) + " " + new Date(when(e)).toTimeString().slice(0, 5), e.description, catKey(e.category) ? catLabel(e.category) : "", Number(e.amount).toFixed(2), curOf(e), name[e.paid_by] || "", name[e.added_by] || "", e.split_type || "equal",
        ...members.map((m) => { const s = sp.find((x) => x.member_id === m.id); return s ? Number(s.share).toFixed(2) : ""; })];
    });
    const csv = "\ufeff" + [head, ...rows].map((r) => r.map(cell).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = `${group.name.replace(/[^\w.-]+/g, "_") || "trip"}-expenses.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  paintExp();
  document.querySelectorAll("[data-settle]").forEach((b) => (b.onclick = async () => {
    const d = debts[+b.dataset.settle];
    b.disabled = true;
    try { await call("add_payment", { p_group: id, p_from: d.from, p_to: d.to, p_amount: d.cents / 100, p_currency: d.currency }); route(); }
    catch (e) { showErr($("perr"), e); b.disabled = false; }
  }));
  document.querySelectorAll("[data-link]").forEach((b) => (b.onclick = async () => {
    const who = name[b.dataset.link];
    const u = prompt(`Username of the account for ${who}?`);
    if (!u || !u.trim()) return;
    try { await call("link_member", { p_member: b.dataset.link, p_username: u.trim() }); route(); } catch (e) { showErr($("perr"), e); }
  }));
  $("addu").onclick = async () => {
    const u = $("newu").value.trim(); if (!u) return;
    try { await call("add_member", { p_group: id, p_name: null, p_username: u }); route(); } catch (e) { showErr($("perr"), e); }
  };
  $("addm").onclick = async () => {
    const n = $("newm").value.trim(); if (!n) return;
    try { await call("add_member", { p_group: id, p_name: n, p_username: null }); route(); } catch (e) { showErr($("perr"), e); }
  };
}

// The add / edit expense form. It is used once at the top (add) and again in place inside an expense card (edit),
// so every field is found by data-f inside its own root element instead of by a page-wide id.
// value for <input type=datetime-local>: local time as YYYY-MM-DDTHH:mm
const localInputValue = (d) => { const t = new Date(d), p = (n) => String(n).padStart(2, "0"); return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}T${p(t.getHours())}:${p(t.getMinutes())}`; };
function formHtml(ctx, editing) {
  const { members, meId, splits } = ctx;
  const youTag = (m) => (m.id === meId ? " (you)" : "");
  const uid = editing ? editing.id : "new";
  const editSplits = editing ? splits.filter((s) => s.expense_id === editing.id) : [];
  const mode = editing && editing.split_type === "percent" ? "percent" : "equal";
  const curCat = editing ? catKey(editing.category) : "";
  const checked = new Set(editing ? editSplits.map((s) => s.member_id) : members.map((m) => m.id));
  const pct = {};
  if (mode === "percent") editSplits.forEach((s) => (pct[s.member_id] = Number(s.percent)));
  else equalPercents([...checked]).forEach((e) => (pct[e.id] = e.percent));
  const whenVal = localInputValue(editing ? (editing.spent_at || editing.created_at) : new Date());
  const cur = editing ? curOf(editing) : getLastCurrency(), known = CURRENCIES.some(([c]) => c === cur);
  return `
      <input data-f="desc" placeholder="What was it for?" value="${editing ? esc(editing.description) : ""}">
      <div class="grid2">
        <input data-f="amt" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Amount" value="${editing ? Number(editing.amount).toFixed(2) : ""}">
        <div class="selbox"><span class="selshow" data-f="ccyshow" aria-hidden="true">${esc(cur)}</span>
          <select data-f="ccy" aria-label="Currency">${(known ? CURRENCIES : [[cur, ""], ...CURRENCIES]).map(([c, n]) => `<option value="${c}" ${c === cur ? "selected" : ""}>${c}${n ? " · " + n : ""}</option>`).join("")}<option value="OTHER">Other…</option></select></div>
        <input data-f="ccyother" class="upper" maxlength="3" placeholder="3-letter code" style="display:none;grid-column:1/-1">
      </div>
      <div class="muted" style="margin-top:6px">When</div>
      <input data-f="when" type="datetime-local" value="${whenVal}" data-init="${editing ? "" : whenVal}">
      <div class="muted" style="margin-top:6px">Category</div>
      <div class="cats" role="radiogroup" aria-label="Category">${CATS.map(([k, label]) =>
        `<label class="catchip"><input type="radio" name="cat-${uid}" value="${k}" ${k === curCat ? "checked" : ""}><span>${catIcon(k)}${label}</span></label>`).join("")}</div>
      <div class="muted" style="margin-top:6px">Paid by</div>
      <select data-f="payer">${members.map((m) => `<option value="${m.id}" ${m.id === (editing ? editing.paid_by : meId) ? "selected" : ""}>${esc(m.name)}${youTag(m)}</option>`).join("")}</select>
      <div class="muted" style="margin-top:6px">Split</div>
      <div class="seg">
        <button type="button" class="segbtn ${mode === "equal" ? "on" : ""}" data-mode="equal">Equally</button>
        <button type="button" class="segbtn ${mode === "percent" ? "on" : ""}" data-mode="percent">By %</button>
      </div>
      <div class="splitbox ${mode === "percent" ? "mode-percent" : ""}" data-f="splitbox">
        ${members.map((m) => `<div class="srow" data-id="${m.id}">
          <label class="chk"><input type="checkbox" class="inc" value="${m.id}" ${checked.has(m.id) ? "checked" : ""}><span class="person">${av(m.name, "sm", m.avatar)}${esc(m.name)}${youTag(m)}</span></label>
          <span class="pctwrap"><input class="pct" type="number" step="0.001" min="0" max="100" inputmode="decimal" value="${pct[m.id] ?? 0}"><span class="muted">%</span></span>
          <span class="prev muted"></span></div>`).join("")}
        <div data-f="pcttotal" class="muted"></div>
      </div>
      <div class="formbtns">
        <button type="button" data-f="save">${editing ? "Save changes" : "Add expense"}</button>
        ${editing ? `<button data-f="cancel" class="ghost" type="button">Cancel</button>` : ""}
      </div>`;
}

function wireForm(root, ctx, editing, onCancel) {
  const { id } = ctx;
  const f = (n) => root.querySelector(`[data-f="${n}"]`);
  const all = (sel) => [...root.querySelectorAll(sel)];
  const rows = () => all(".srow");
  let mode = editing && editing.split_type === "percent" ? "percent" : "equal";
  const getCcy = () => (f("ccy").value === "OTHER" ? f("ccyother").value : f("ccy").value).trim().toUpperCase();

  function updatePreview() {
    rows().forEach((r) => (r.querySelector(".prev").textContent = ""));
    const amount = parseFloat(f("amt").value), cur = getCcy();
    const show = (memberId, share) => { const r = rows().find((x) => x.dataset.id === memberId); if (r) r.querySelector(".prev").textContent = `${cur} ${share.toFixed(2)}`; };
    if (mode === "percent") {
      const entries = rows().map((r) => ({ id: r.dataset.id, percent: parseFloat(r.querySelector(".pct").value) || 0 }));
      const tot = entries.reduce((t, e) => t + Math.round(e.percent * 1000), 0) / 1000;
      const el = f("pcttotal");
      el.textContent = `Total ${tot}%` + (tot === 100 ? "" : " (must be 100%)");
      el.className = tot === 100 ? "muted" : "err";
      if (tot === 100 && amount > 0) percentSplit(amount, entries).forEach((s) => show(s.member_id, s.share));
    } else if (amount > 0) {
      const ids = rows().filter((r) => r.querySelector(".inc").checked).map((r) => r.dataset.id);
      if (ids.length) equalSplit(amount, ids).forEach((s) => show(s.member_id, s.share));
    }
  }

  all("[data-mode]").forEach((b) => (b.onclick = () => {
    const next = b.dataset.mode;
    if (next === mode) return;
    if (next === "percent") {   // start from an even split between whoever is ticked
      const ids = rows().filter((r) => r.querySelector(".inc").checked).map((r) => r.dataset.id);
      const even = Object.fromEntries(equalPercents(ids).map((e) => [e.id, e.percent]));
      rows().forEach((r) => (r.querySelector(".pct").value = even[r.dataset.id] ?? 0));
    }
    mode = next;
    f("splitbox").classList.toggle("mode-percent", next === "percent");
    all("[data-mode]").forEach((x) => x.classList.toggle("on", x.dataset.mode === next));
    updatePreview();
  }));
  ["amt", "ccyother"].forEach((k) => (f(k).oninput = updatePreview));
  f("ccy").onchange = () => {
    const v = f("ccy").value;
    f("ccyshow").textContent = v === "OTHER" ? "Other…" : v;   // the closed box shows just the code; the list shows full names
    f("ccyother").style.display = v === "OTHER" ? "" : "none"; if (v === "OTHER") f("ccyother").focus(); updatePreview();
  };
  rows().forEach((r) => { r.querySelector(".inc").onchange = updatePreview; r.querySelector(".pct").oninput = updatePreview; });

  if (editing) f("cancel").onclick = onCancel;

  f("save").onclick = async (ev) => {
    const description = f("desc").value.trim(), amount = parseFloat(f("amt").value);
    const currency = getCcy();
    if (!description) { toast("What was it for?"); return; }
    if (!(amount > 0)) { toast("Enter an amount more than 0."); return; }
    if (!/^[A-Z]{3}$/.test(currency)) { toast("Currency must be a 3-letter code, e.g. SGD or MYR."); return; }
    // untouched "now" default on a new expense means the moment of saving, not when the page was opened
    const whenEl = f("when"), whenDate = new Date(!editing && whenEl.dataset.init === whenEl.value ? Date.now() : whenEl.value);
    if (!whenEl.value || isNaN(whenDate)) { toast("Pick a date and time."); return; }
    let split;
    try {
      if (mode === "equal") {
        const ids = rows().filter((r) => r.querySelector(".inc").checked).map((r) => r.dataset.id);
        if (!ids.length) throw new Error("Pick at least one person to split with.");
        split = equalSplit(amount, ids);
      } else {
        split = percentSplit(amount, rows().map((r) => ({ id: r.dataset.id, percent: parseFloat(r.querySelector(".pct").value) || 0 })));
      }
    } catch (e) { toast(e.message); return; }
    const picked = root.querySelector('input[type="radio"]:checked');
    ev.target.disabled = true;
    try {
      await call("save_expense", {
        p_id: editing ? editing.id : null, p_group: id, p_description: description, p_amount: amount,
        p_currency: currency, p_paid_by: f("payer").value, p_split_type: mode, p_splits: split,
        p_category: picked ? picked.value : "", p_spent_at: whenDate.toISOString() });
      setLastCurrency(currency);
      route();
    } catch (e) { showErr(null, e); ev.target.disabled = false; }
  };

  updatePreview();
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
